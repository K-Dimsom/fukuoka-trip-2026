var P={"DAYS":[{"id":"d1","label":"11/22 일","color":"#e74c3c","title":"11/22 (일) 도착일","sub":"호텔 짐 보관 → 이나다 슬롯 확인(불가하면 라라포트 점심) → ν건담 → 체크인 → 오호리 → 예약 아즈마 → 신신은 대기 길면 생략","box":"이나다는 11월 영업과 슬롯이 미확정이에요. 출발 전에 휴업이 확인되면 방문 자체를 생략하고 호텔에서 라라포트로 바로 이동하세요(별도 길안내 확인). 당일 13:05에 늦은 슬롯만 남았으면 기다리지 말고 라라포트 식당가로 가요. 텐진 라멘집으로 되돌아가는 대안은 낮 동선에서 제외했어요.","items":[{"i":1,"id":"airport","t":"10:55","n":"후쿠오카공항 국제선 도착 (Arrive Fukuoka Airport, ZE941)","note":"입국·수하물에 약 50~60분 예상. 짐은 호텔에 먼저 맡겨요(호텔 공식 FAQ: 체크인 전 짐 보관 무료). 사가와 호텔 배송은 제휴 호텔 목록이 공개돼 있지 않아 쓰지 않았어요.","shop":"airport","guide":"<b>공항 → 호텔 (짐 맡기기)</b><br>① 국제선 1층 <b>5번 정류장</b> 무료 셔틀(5~6분 간격, 약 10분) → <b>국내선 터미널/남쪽</b> 하차<br>② 지하철 입구 1A·1B → <b>쿠코선 (Kuko Line / 空港線)</b> 하카타 (Hakata / 博多)까지 약 5분<br>③ 하카타역에서 <b>나나쿠마선 (Nanakuma Line / 七隈線)</b>으로 갈아타 <b>텐진미나미 (Tenjin-Minami / 天神南)</b>까지 약 3분<br>④ 6번 출구에서 호텔까지 도보 약 7분. 호텔 안내 기준 공항 → 텐진미나미 약 18분(환승 4분 포함). 요금은 260엔으로 추정(개찰구 요금표 확인).","ll":[33.5848,130.4443]},{"i":2,"id":"hotel","t":"12:30","n":"호텔에 짐 맡기기 (Drop Bags at Hotel)","note":"프런트에 예약자 이름을 말하고 짐을 맡겨요. 1층 로비에 투숙객 무료 락커도 있어요. 체크인은 17:15에 해요.","shop":"hotel","guide":"","ll":[33.5877,130.4067]},{"i":3,"id":"inada","t":"12:55","n":"라멘 이나다 슬롯 확인·조건부 점심 (Ramen Inada)","note":"12:55 도착은 목표. 13:05까지 3명 슬롯과 11월 영업방식을 확인해요. 13:30까지 입장하고 14:05까지 식사를 마칠 수 있을 때만 먹어요(일정용 기준, 실측 아님). 휴업·매진·늦은 슬롯이면 바로 라라포트로 이동해 식당가에서 점심을 먹어요. 6석이라 3명 동시 착석은 보장되지 않아요.","shop":"inada","guide":"","ll":[33.5789205,130.4151993]},{"i":4,"id":"lalaport","t":"15:15","n":"라라포트 후쿠오카 (LaLaport Fukuoka, ν건담 입상)","note":"16:00 쇼(건담이 움직임)를 보고 16:30에 출발해요. 건담 베이스 매장은 캐널시티(11/25)에 있어요. 이나다 불발 시에는 이곳에 먼저 와 식당가 점심을 해결해요. 15:30까지 식사를 마치고 16:00 쇼로 이동하는 게 목표예요. 식당 대기는 현장에서 확인하세요.","shop":"lalaport","guide":"","ll":[33.56571,130.43754]},{"i":5,"id":"hotel","t":"17:15","n":"호텔 체크인 (Hotel Check-in, CROSS life Hakata Tenjin)","note":"체크인 15:00 이후. 낮에 맡긴 짐을 찾아 방에 올려 두고 가볍게 나가요.","shop":"hotel","guide":"","ll":[33.5877,130.4067]},{"i":6,"id":"ohori","t":"17:55","n":"오호리 공원 (Ohori Park)","no function setHH(){document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');}window.addEventListener('resize',function(){setHH();if(map)map.invalidateSize();});function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstChild;}
function gm(id){var c=P.COORDS[id];if(!c)return '#';return 'https://www.google.com/maps/search/?api=1&query='+c[0]+','+c[1];}
function gdir(l){var m=l.type==='sub'?'transit':'walking';return 'https://www.google.com/maps/dir/?api=1&origin='+l.aLL[0]+','+l.aLL[1]+'&destination='+l.bLL[0]+','+l.bLL[1]+'&travelmode='+m;}
function sn(it){var f=P.INFO[it.shop];var n=f?f.ko:it.n;return n.replace(/\(.*?\)/g,'').replace('Brackets Hotel Hommachi','호텔').trim();}
function shopTable(s){var rows=[['영업',s.hours],['휴무',s.closed],['결제',s.pay],['좌석',s.seat],['가격',s.price],['예약',s.res],['대기',s.wait],['주소',s.addr]],h='<table>';rows.forEach(function(r){if(r[1]&&r[1]!=='-')h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';});return h+'</table>';}
function buildTabs(){tabsEl.innerHTML='';var all=[{label:'준비',color:'#555'}].concat(P.DAYS);all.forEach(function(d,i){var b=document.createElement('div');b.textContent=d.label;b.className=i===cur?'on':'';if(i===cur)b.style.background=d.color;b.onclick=function(){go(i)};tabsEl.appendChild(b);});}
function chkBox(rows,title){var K={'예약':'k1','예약 확인':'k1','영업 확인':'k2','당일':'k3','준비':'k4','확인':'k4','참고':'k4'};return '<div class="chk"><h4>'+title+'</h4>'+rows.map(function(r){return '<div class="r"><span class="chip '+(K[r[0]]||'k4')+'">'+r[0]+'</span><div><span class="when">'+r[1]+'</span>'+r[2]+'</div></div>';}).join('')+'</div>';}
function diffBox(){var C={'변경':'#1f5fa8','삭제':'#c0392b','정정':'#8e44ad','확인 필요':'#a07a00'};return '<div class="diffw"><h3 style="margin:0 0 4px">기존 일정표와 달라진 점</h3><p class="dsub">일정표의 항목을 가게 영업일, 대기, 교통 시각을 직접 확인한 뒤 바꾼 이유예요. 확인 못 한 항목은 본문에 따로 표시했어요.</p><table class="diff"><thead><tr><th>날짜</th><th>기존 일정표</th><th>변경 후</th><th>왜 바꿨나</th></tr></thead><tbody>'+P.DIFF.map(function(r){return '<tr><td data-l="날짜">'+r[0]+' <span class="st" style="background:'+(C[r[4]]||'#555')+'">'+r[4]+'</span></td><td data-l="기존 일정표">'+r[1]+'</td><td data-l="변경 후"><b>'+r[2]+'</b></td><td data-l="왜 바꿨나">'+r[3]+'</td></tr>';}).join('')+'</tbody></table></div>';}
function nofixBox(){if(!P.NOFIX)return '';return '<div class="diffw"><h3 style="margin:0 0 4px">반영하지 못한 것과 제안</h3><p class="dsub">일정표대로 할 수 없는 항목, 이유, 대신 어떻게 하면 되는지예요.</p><table class="diff"><thead><tr><th>항목</th><th>못 하는 이유</th><th>제안</th></tr></thead><tbody>'+P.NOFIX.map(function(r){return '<tr><td data-l="항목">'+r[0]+'</td><td data-l="못 하는 이유">'+r[1]+'</td><td data-l="제안"><b>'+r[2]+'</b></td></tr>';}).join('')+'</tbody></table></div>';}
function waitPolicy(){return '<div class="how"><b>대기시간 읽는 법 · 재정비 반영</b><p>'+P.WAIT_POLICY+'</p></div>';}
function renderPrep(){
 var h='<div class="hero"><h2>출발 전 준비</h2><p>예약과 확인할 것을 먼저 끝내세요</p></div>'+waitPolicy()+diffBox()+chkBox(P.WAIT_AUDIT,'방문 조건과 대기시간 근거')+nofixBox()+chkBox(P.CHECKS.prep,'먼저 해야 할 것');
 h+='<h3>교통 이용 방법과 요금</h3><div class="how">'+P.TRANS+'</div><h3>폰에서 보는 방법</h3><div class="how">'+P.HOW+'</div>';
 h+='<h3>일본어 문장</h3>'+P.PHR.map(function(p){return '<div class="ph">'+p[0]+'<b>'+p[1]+'</b><div class="en">'+p[2]+'</div><div class="en">'+p[3]+'</div></div>';}).join('');
 h+='<h3>예산</h3><table class="t">'+P.BUDGET.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('')+'</table><h3>전체 가게 정보</h3>';
 Object.keys(P.INFO).forEach(function(k){var s=P.INFO[k];if(!s.what)return;h+='<div class="sh"><b>'+s.ko+'</b> <span class="en">'+(s.jp?s.jp+' / ':'')+s.en+'</span><div class="what">'+s.what+'</div>'+(s.order&&s.order!=='-'?'<div class="order"><b>추천</b> '+s.order+'</div>':'')+(s.hours?shopTable(s):'')+'</div>';});
 mainEl.innerHTML=h;
}
function pickBar(d){if(!d.vlabel||!P.D4V)return '';var cur4=P.DAYS[3].vlabel;return '<div class="pick"><b>11/25 점심 선택</b>'+Object.keys(P.D4V).map(function(k){var on=P.D4V[k].vlabel===cur4;return '<span class="pbtn'+(on?' on':'')+'" style="'+(on?'background:'+d.color+';border-color:'+d.color:'')+'" onclick="pickLunch(\''+k+'\')">'+P.D4V[k].vlabel+'</span>';}).join('')+'<small>고르면 지도·동선·시간이 바로 바뀌어요</small></div>';}
function pickLunch(k){P.DAYS[3]=P.D4V[k];try{localStorage.setItem('fk_lunch',k)}catch(e){}go(4);}
function renderDay(d){
 var wm=0,wd=0;d.legs.forEach(function(l){if(l.type==='walk'){wm+=l.min;wd+=l.dist;}else{wm+=(l.wk||0);wd+=(l.wkd||0)*1000;}});
 var h='<div class="hero"><h2 style="color:'+d.color+'">'+d.title+'</h2><p>'+d.sub+'</p><p class="sum">도보 합계 약 '+wm+'분 ('+(wd/1000).toFixed(1)+'km, 지하철 구간 안의 도보 포함)</p></div>'+pickBar(d)+waitPolicy()+chkBox(d.waitPlan||[],'대기시간 기준과 중단 시각')+chkBox(P.CHECKS[d.id],'이 날 먼저 확인할 것');
 h+='<div class="stickybox" id="sb"><div class="segs" id="segs"><div class="seg on" data-k="-1" style="background:'+d.color+'"><b>전체 동선</b><small>모두 보기</small></div>'+d.legs.map(function(l,k){var a=d.items[k],b=d.items[k+1];return '<div class="seg" data-k="'+k+'"><b>'+l.ai+'→'+l.bi+'</b><small>'+(l.type==='sub'?(l.tag||'지하철'):l.min+'분')+'</small></div>';}).join('')+'</div>';
 h+='<div class="seginfo"><span class="btn" id="ip">‹</span><span class="btn" id="in">›</span><div id="info"><span>구간을 누르면 지도와 아래 목록에서 그 구간이 선택돼요.</span></div><span class="btn" id="mt">지도 접기</span></div><div class="map" id="map"></div></div>';
 d.items.forEach(function(it,i){var s=P.INFO[it.shop]||{};
  h+='<div class="item" data-i="'+i+'" style="--c:'+d.color+'"><div class="top"><div class="num" style="background:'+d.color+'">'+it.i+'</div><div class="time">'+it.t+'</div><div style="flex:1;min-width:0"><div class="name">'+it.n+(s.cash?'<span class="tag">현금</span>':'')+'</div>'+(s.en?'<div class="en">'+(s.jp&&s.jp!==s.ko?s.jp+' · ':'')+s.en+'</div>':'')+(it.note?'<div class="note">'+it.note+'</div>':'')+(s.what?'<div class="what">'+s.what+'</div>':'')+(s.order&&s.order!=='-'?'<div class="order"><b>추천 메뉴</b> '+s.order+'</div>':'')+(s.tip?'<div class="tip">'+s.tip+'</div>':'')+(s.wait&&s.wait!=='-'?'<div class="tip">대기 · '+s.wait+'</div>':'')+'<a class="btn" href="'+gm(it.id)+'" target="_blank">지도 열기</a>'+(s.hours?'<details><summary class="btn">영업·결제 정보</summary>'+shopTable(s)+'</details>':'')+(it.guide?'<div class="guide">'+it.guide+'</div>':'')+'</div></div></div>';
  var l=d.legs[i];if(l){h+='<div class="leg'+(l.type==='sub'?' sub':'')+'" data-k="'+i+'" style="--c:'+d.color+'"><b>'+(l.type==='sub'?l.title+' · '+l.fare:'도보 '+l.min+'분 · '+(l.dist/1000).toFixed(1)+'km')+'</b>'+(l.alt?'<div class="alt">'+l.alt+'</div>':'')+(l.guide?'<div class="guide">'+l.guide+'</div>':'')+'<a class="btn" href="'+gdir(l)+'" target="_blank">구글맵 길안내</a></div>';}
 });
 if(d.box)h+='<div class="box">'+d.box+'</div>';
 h+='<div class="pn">'+(cur>0?'<button id="pv">이전</button>':'')+(cur<P.DAYS.length?'<button id="nx">다음</button>':'')+'</div>';
 mainEl.innerHTML=h;
 var pv=document.getElementById('pv'),nx=document.getElementById('nx');if(pv)pv.onclick=function(){go(cur-1)};if(nx)nx.onclick=function(){go(cur+1)};
 initMap(d);
}
function initMap(d){
 sel=-1;var box=document.getElementById('map');
 map=L.map(box,{tap:true});
 L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'地図: 国土地理院'}).addTo(map);
 var lines=d.legs.map(function(l,k){var pl=L.polyline(l.pts,{color:d.color,weight:l.type==='sub'?3:5,opacity:.9,dashArray:l.type==='sub'?'8 8':null});var mid=l.pts[Math.floor(l.pts.length/2)];var txt=l.type==='sub'?('약 '+l.min+'분'):l.min+'분';var tl=L.marker(mid,{interactive:false,icon:L.divIcon({className:'',html:'<div class="tl" style="border-color:'+d.color+';color:'+d.color+'">'+txt+'</div>',iconSize:[0,0],iconAnchor:[-4,10]})});pl.on('click',function(){setSel(k)});return L.layerGroup([pl,tl]);});
 var byLL={};d.items.forEach(function(it){var k=it.ll.join(',');(byLL[k]=byLL[k]||{it:it,n:[]}).n.push(it.i);});
 var mk={};Object.keys(byLL).forEach(function(k){var o=byLL[k];var t=o.n.join('·');var w=Math.max(26,12+t.length*8);mk[k]=L.marker(o.it.ll,{icon:L.divIcon({className:'',html:'<div style="background:'+d.color+';color:#fff;border:2px solid #fff;border-radius:12px;width:'+w+'px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5)">'+t+'</div>',iconSize:[w,24],iconAnchor:[w/2,12]})}).bindTooltip(sn(o.it),{permanent:window.innerWidth>=600,direction:'right',offset:[12,0]});});
 var allPts=[];d.legs.forEach(function(l){l.pts.forEach(function(p){allPts.push(p)})});
 var btn=document.createElement('div');btn.className='fsbtn';btn.textContent='크게 보기';btn.onclick=function(e){e.stopPropagation();box.classList.toggle('full');document.body.classList.toggle('fs',box.classList.contains('full'));btn.textContent=box.classList.contains('full')?'닫기':'크게 보기';setTimeout(function(){map.invalidateSize();fit()},60);};box.appendChild(btn);
 function fit(){var pts=sel<0?allPts:d.legs[sel].pts;map.fitBounds(pts,{padding:[60,60],maxZoom:15});}
 function clear(){lines.forEach(function(g){map.removeLayer(g)});Object.keys(mk).forEach(function(k){map.removeLayer(mk[k])});}
 S={d:d,lines:lines,mk:mk,fit:fit,clear:clear};
 document.querySelectorAll('#segs .seg').forEach(function(e){e.onclick=function(){setSel(+e.getAttribute('data-k'))}});
 document.querySelectorAll('.leg').forEach(function(e){e.onclick=function(ev){if(ev.target.tagName==='A')return;setSel(+e.getAttribute('data-k'),true)}});
 document.querySelectorAll('.item').forEach(function(e){e.onclick=function(ev){if(ev.target.tagName==='A'||ev.target.tagName==='SUMMARY')return;var i=+e.getAttribute('data-i');setSel(i>0?i-1:0,true)}});
 document.getElementById('ip').onclick=function(){var n=S.d.legs.length;setSel(sel<0?n-1:sel-1)};document.getElementById('in').onclick=function(){var n=S.d.legs.length;setSel(sel>=n-1?-1:sel+1)};var mt=document.getElementById('mt');mt.onclick=function(){var sb=document.getElementById('sb');sb.classList.toggle('mapoff');mt.textContent=sb.classList.contains('mapoff')?'지도 펼치기':'지도 접기';setTimeout(function(){map.invalidateSize();S.fit();},60);};
 setSel(-1,true);
}
function setSel(k,noScroll){
 sel=k;var d=S.d;S.clear();
 if(k<0){S.lines.forEach(function(g){g.addTo(map)});Object.keys(S.mk).forEach(function(x){S.mk[x].addTo(map)});}
 else{var l=d.legs[k];S.lines[k].addTo(map);S.mk[l.aLL.join(',')].addTo(map);S.mk[l.bLL.join(',')].addTo(map);}
 document.querySelectorAll('#segs .seg').forEach(function(e){var on=(+e.getAttribute('data-k'))===k;e.classList.toggle('on',on);e.style.background=on?d.color:'#fff';});
 document.querySelectorAll('.leg').forEach(function(e){var on=(+e.getAttribute('data-k'))===k;e.classList.toggle('sel',on);e.style.background=on?d.color:'#fcfcfc';});
 document.querySelectorAll('.item').forEach(function(e){var i=+e.getAttribute('data-i');var on=k>=0&&(i===k||i===k+1);e.classList.toggle('sel',on);e.style.background=on?d.color+'22':'#fff';e.style.borderLeftColor=on?d.color:'#e6e2d8';});
 var info=document.getElementById('info');
 if(k<0){info.innerHTML='<span>전체 동선 · 구간을 누르면 지도와 목록에서 선택돼요</span>';}
 else{var l=d.legs[k];info.innerHTML='<span><b>'+l.ai+'→'+l.bi+' '+sn(d.items[k])+' → '+sn(d.items[k+1])+'</b> · '+(l.type==='sub'?l.title+' · '+l.fare:'도보 '+l.min+'분 · '+(l.dist/1000).toFixed(1)+'km')+'</span><a class="btn" href="'+gdir(l)+'" target="_blank">길안내</a>';
  }
 if(window.innerWidth<600){Object.keys(S.mk).forEach(function(x){S.mk[x].closeTooltip()});if(k>=0){var l2=d.legs[k];S.mk[l2.aLL.join(',')].openTooltip();S.mk[l2.bLL.join(',')].openTooltip();}}S.fit();if(!noScroll&&k>=0)scrollToItem(k);
}
function scrollToItem(k){var el=document.querySelector('.item[data-i="'+k+'"]');var sb=document.getElementById('sb');if(!el||!sb)return;var off=sb.getBoundingClientRect().bottom+8;window.scrollTo({top:window.scrollY+el.getBoundingClientRect().top-off,behavior:'smooth'});}
function go(i){cur=Math.max(0,Math.min(P.DAYS.length,i));if(map){map.remove();map=null}buildTabs();setHH();if(cur===0)renderPrep();else renderDay(P.DAYS[cur-1]);try{history.replaceState(null,'','#'+(cur===0?'prep':P.DAYS[cur-1].id))}catch(e){}window.scrollTo(0,0);}
try{var lk=localStorage.getItem('fk_lunch');if(lk&&P.D4V&&P.D4V[lk])P.DAYS[3]=P.D4V[lk];}catch(e){}
var st=['prep','d1','d2','d3','d4'].indexOf((location.hash||'').replace('#',''));go(st<0?0:st);
</script></body></html>
